<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - CarbonIndexPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            border: 1px solid #e2e8f0;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 30px;
            display: block;
            text-align: center;
            text-decoration: none;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            margin-bottom: 20px;
        }

        .btn-auth {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }

            .btn-auth:hover {
                background: #1e293b;
                transform: translateY(-2px);
            }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }

            .auth-footer a {
                color: #3b82f6;
                text-decoration: none;
                font-weight: 600;
            }
    </style>
</head>
<body>

    <div class="auth-card">
        <a href="index.html" class="logo">CarbonIndex<span style="color:#3b82f6">Pro</span></a>

        <h4 class="fw-bold mb-4 text-center">Bon retour 👋</h4>

        <form id="loginForm">
            <label class="small fw-bold mb-1">Email professionnel</label>
            <input type="email" class="form-control" id="email" placeholder="nom@entreprise.com" required>

            <label class="small fw-bold mb-1">Mot de passe</label>
            <input type="password" class="form-control" id="password" placeholder="••••••••" required>

            <div class="d-flex justify-content-between mb-4 small">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">Se souvenir de moi</label>
                </div>
                <a href="#" class="text-muted">Oublié ?</a>
            </div>

            <button type="submit" class="btn-auth">Se connecter</button>
        </form>

        <div class="auth-footer">
            Pas encore de compte ? <a href="register.html">Créer un compte</a>
        </div>
    </div>

</body>
</html>
