<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sondage Mobilité - CarbonIndexPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .survey-card {
            background: white;
            max-width: 500px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .survey-header {
            background: #0f172a;
            padding: 30px;
            text-align: center;
            color: white;
        }

        .survey-body {
            padding: 30px;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .btn-submit {
            background: #3b82f6;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            transition: 0.2s;
        }

            .btn-submit:hover {
                background: #2563eb;
                transform: translateY(-2px);
            }

        .success-message {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .icon-check {
            font-size: 4rem;
            color: #10b981;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="survey-card" id="formPanel">
        <div class="survey-header">
            <h4 class="fw-bold mb-1">Enquête Mobilité 🚗</h4>
            <p class="small opacity-75 mb-0">Aidez votre entreprise à réduire son empreinte.</p>
        </div>
        <div class="survey-body">
            <form onsubmit="envoyerReponse(event)">

                <div class="mb-4">
                    <label class="form-label">1. Comment venez-vous au travail ?</label>
                    <select class="form-select" required>
                        <option value="" selected disabled>Choisir...</option>
                        <option value="voiture">Voiture Thermique (Seul)</option>
                        <option value="covoit">Covoiturage</option>
                        <option value="tec">Transports en commun</option>
                        <option value="velo">Vélo / Marche</option>
                        <option value="elec">Voiture Électrique</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">2. Distance Domicile-Travail (Aller simple)</label>
                    <div class="input-group">
                        <input type="number" class="form-control" placeholder="Ex: 15" required>
                        <span class="input-group-text">km</span>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">3. Jours de Télétravail / semaine</label>
                    <select class="form-select">
                        <option value="0">0 jour</option>
                        <option value="1">1 jour</option>
                        <option value="2">2 jours</option>
                        <option value="3">3 jours +</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Valider ma réponse</button>
            </form>
            <p class="text-center text-muted small mt-3 mb-0">Anonyme & Sécurisé par CarbonIndexPro</p>
        </div>
    </div>

    <div class="survey-card success-message" id="successPanel">
        <div class="icon-check">✅</div>
        <h3 class="fw-bold text-slate-800">Merci !</h3>
        <p class="text-muted">Votre réponse a bien été prise en compte.</p>
        <p class="small text-muted mt-4">Vous pouvez fermer cette page.</p>
    </div>

    <script>
        function envoyerReponse(e) {
            e.preventDefault(); // Empêche le rechargement de la page

            // Simulation d'envoi (Animation)
            const btn = document.querySelector('.btn-submit');
            btn.innerHTML = "Envoi en cours...";
            btn.style.opacity = "0.7";

            setTimeout(() => {
                document.getElementById('formPanel').style.display = 'none';
                document.getElementById('successPanel').style.display = 'block';
            }, 1000);
        }
    </script>

</body>
</html>
