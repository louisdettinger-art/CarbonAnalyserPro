<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription - CarbonIndexPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            border: 1px solid #e2e8f0;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 20px;
            display: block;
            text-align: center;
            text-decoration: none;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            margin-bottom: 15px;
        }

        .btn-auth {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
            margin-top: 10px;
        }

            .btn-auth:hover {
                background: #2563eb;
                transform: translateY(-2px);
            }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }

            .auth-footer a {
                color: #0f172a;
                text-decoration: none;
                font-weight: 600;
            }
    </style>
</head>
<body>

    <div class="auth-card">
        <a href="index.html" class="logo">CarbonIndex<span style="color:#3b82f6">Pro</span></a>

        <h4 class="fw-bold text-center mb-2">Commencez votre Audit</h4>
        <p class="text-center text-muted small mb-4">Créez votre espace pour piloter votre stratégie RSE.</p>

        <form id="registerForm">
            <div class="row">
                <div class="col-6">
                    <label class="small fw-bold mb-1">Nom Entreprise</label>
                    <input type="text" class="form-control" id="companyName" required>
                </div>
                <div class="col-6">
                    <label class="small fw-bold mb-1">Siret (Optionnel)</label>
                    <input type="text" class="form-control" id="siret">
                </div>
            </div>

            <label class="small fw-bold mb-1">Email professionnel</label>
            <input type="email" class="form-control" id="email" required>

            <label class="small fw-bold mb-1">Mot de passe</label>
            <input type="password" class="form-control" id="password" required>

            <div class="form-check small mb-3">
                <input class="form-check-input" type="checkbox" id="cgu" required>
                <label class="form-check-label text-muted" for="cgu">J'accepte les CGU et la politique de confidentialité.</label>
            </div>

            <button type="submit" class="btn-auth">Créer mon Espace Expert</button>
        </form>

        <div class="auth-footer">
            Déjà un compte ? <a href="login.html">Se connecter</a>
        </div>
    </div>

    <script type="module">
        // 1. On importe nos outils depuis le fichier config
        import { auth, db } from './js/firebase-config.js';
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 2. Quand on soumet le formulaire
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Empêche le rechargement de la page

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const companyName = document.getElementById('companyName').value;
            const siret = document.getElementById('siret').value;
            const btn = document.querySelector('.btn-auth');

            try {
                btn.innerHTML = "Création en cours...";
                btn.disabled = true;

                // A. Créer l'utilisateur dans l'Authentication (Email/Mdp)
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // B. Créer sa fiche entreprise dans la Base de Données (Firestore)
                // On crée un document avec l'ID de l'utilisateur (UID)
                await setDoc(doc(db, "entreprises", user.uid), {
                    nom: companyName,
                    email: email,
                    siret: siret,
                    dateCreation: new Date().toISOString(),
                    pack: "gratuit" // Par défaut, on le passera en Expert après paiement
                });

                // C. Succès ! On redirige vers le Dashboard
                alert("Compte créé avec succès ! Bienvenue " + companyName);
                window.location.href = "dashboard.html";

            } catch (error) {
                console.error(error);
                let message = "Erreur inconnue.";
                if(error.code === 'auth/email-already-in-use') message = "Cet email est déjà utilisé.";
                if(error.code === 'auth/weak-password') message = "Le mot de passe doit faire 6 caractères minimum.";

                alert("Erreur : " + message);
                btn.innerHTML = "Créer mon Espace Expert";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
